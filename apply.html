<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recruitment Portal | Tropical RP</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Space+Grotesk:wght@700&display=swap');
        :root { --blue: #3b82f6; --bg: #020617; --card: #0f172a; --border: rgba(255,255,255,0.1); }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; }
        
        .full-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(2, 6, 23, 0.8), rgba(2, 6, 23, 0.9)), 
                        url('https://cdn.discordapp.com/attachments/1472741931258744854/1473043718549536988/image.png');
            background-size: cover; z-index: -1;
        }

        .apply-box { max-width: 850px; margin: 60px auto; padding: 50px; background: var(--card); border-radius: 24px; border: 1px solid var(--border); box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
        h1 { font-family: 'Space Grotesk'; font-size: 2.2rem; margin: 0; text-transform: uppercase; letter-spacing: -1px; }
        .subtitle { color: #64748b; margin-bottom: 30px; font-size: 0.9rem; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        label { display: block; font-size: 0.7rem; font-weight: 800; color: var(--blue); text-transform: uppercase; margin-bottom: 8px; letter-spacing: 1px; }
        
        input, textarea, select { 
            width: 100%; background: #1e293b; border: 1px solid #334155; padding: 14px; 
            border-radius: 10px; color: white; font-family: inherit; font-size: 0.9rem; box-sizing: border-box;
        }
        textarea { resize: vertical; min-height: 80px; }
        input:focus, textarea:focus { border-color: var(--blue); outline: none; background: #1e2945; }

        .submit-btn { 
            background: var(--blue); color: white; border: none; padding: 18px; border-radius: 12px; 
            font-weight: 800; cursor: pointer; width: 100%; font-size: 1rem; margin-top: 20px;
            transition: 0.3s ease;
        }
        .submit-btn:hover { transform: translateY(-3px); background: #2563eb; }
    </style>
</head>
<body>
    <div class="full-bg"></div>
    <div class="apply-box">
        <h1>LEO <span style="color:var(--blue)">Recruitment</span></h1>
        <p class="subtitle">Official application for LAPD and LASD departments.</p>

        <form id="leoApp">
            <div class="grid">
                <div>
                    <label>Agency Selection</label>
                    <select id="dept" onchange="updateLabels()" required>
                        <option value="LAPD">Los Angeles Police Department</option>
                        <option value="LASD">Los Angeles Sheriff's Department</option>
                    </select>
                </div>
                <div>
                    <label>Q9: Age</label>
                    <input type="number" id="age" required>
                </div>
            </div>

            <div class="grid">
                <div>
                    <label>Discord Username</label>
                    <input type="text" id="discord" placeholder="name#0000" required>
                </div>
                <div>
                    <label>Q8: Past LEO Experience</label>
                    <input type="text" id="experience" required>
                </div>
            </div>

            <label id="l1">Q1: Why do you want to join the LAPD?</label>
            <textarea id="q1" required></textarea>

            <label>Q2: Why should we choose you over other applicants?</label>
            <textarea id="q2" required></textarea>

            <label>Q3: 2 Strengths & 2 Weaknesses</label>
            <textarea id="q3" required></textarea>

            <label id="l4">Q4: What is the main responsibilities of an officer?</label>
            <textarea id="q4" required></textarea>

            <label id="l5">Q5: How would you handle an officer not following protocol?</label>
            <textarea id="q5" required></textarea>

            <label>Q6: Civilian refusing to comply on a traffic stop?</label>
            <textarea id="q6" required></textarea>

            <label>Q7: Suspect threatening to rob a bank with a weapon?</label>
            <textarea id="q7" required></textarea>

            <button type="submit" class="submit-btn">SUBMIT TO COMMAND STAFF</button>
        </form>
    </div>

    <script>
        function updateLabels() {
            const dept = document.getElementById('dept').value;
            const isLAPD = dept === "LAPD";
            document.getElementById('l1').innerText = `Q1: Why do you want to join ${isLAPD ? 'LAPD' : 'LASD'}?`;
            document.getElementById('l4').innerText = `Q4: Main responsibilities of a ${isLAPD ? 'officer' : 'deputy'}?`;
            document.getElementById('l5').innerText = `Q5: Fellow ${isLAPD ? 'officer' : 'deputy'} not following protocol?`;
        }

        document.getElementById('leoApp').addEventListener('submit', function(e) {
            e.preventDefault();
            const webhook = "YOUR_DISCORD_WEBHOOK_URL_HERE";
            const dept = document.getElementById('dept').value;

            const content = {
                username: "Recruitment Bot",
                embeds: [{
                    title: `New ${dept} Application`,
                    color: dept === "LAPD" ? 2123412 : 15105570,
                    fields: [
                        { name: "Discord", value: document.getElementById('discord').value, inline: true },
                        { name: "Age", value: document.getElementById('age').value, inline: true },
                        { name: "Experience", value: document.getElementById('experience').value },
                        { name: "Q1: Why us?", value: document.getElementById('q1').value },
                        { name: "Q2: Why you?", value: document.getElementById('q2').value },
                        { name: "Q3: Strengths/Weaks", value: document.getElementById('q3').value },
                        { name: "Q4: Duties", value: document.getElementById('q4').value },
                        { name: "Q5: Protocol", value: document.getElementById('q5').value },
                        { name: "Q6: Traffic Stop", value: document.getElementById('q6').value },
                        { name: "Q7: Bank Robbery", value: document.getElementById('q7').value }
                    ]
                }]
            };

            fetch(webhook, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(content) })
            .then(() => alert("Application Sent!"));
        });
    </script>
</body>
</html>
