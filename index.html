<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tropical RP | Los Angeles</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;700;800&family=Space+Grotesk:wght@700&display=swap');
        
        :root { --blue: #3b82f6; --bg: #020617; }
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; background: var(--bg); color: white; font-family: 'Plus Jakarta Sans', sans-serif; height: 100vh; overflow: hidden; }

        .full-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(2, 6, 23, 0.5), rgba(2, 6, 23, 0.8)), 
                        url('https://cdn.discordapp.com/attachments/1472741931258744854/1473404367146188930/Screenshot_2026-02-17_143610.png');
            background-size: cover; background-position: center;
            z-index: -1; animation: subtleZoom 20s infinite alternate;
        }

        nav { position: absolute; top: 0; width: 100%; padding: 40px 6%; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
        .logo { font-family: 'Space Grotesk'; font-size: 1.4rem; letter-spacing: 3px; color: var(--blue); text-transform: uppercase; }
        .nav-links a { color: #cbd5e1; text-decoration: none; margin-left: 30px; font-weight: 700; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; }
        .nav-links a:hover { color: white; text-shadow: 0 0 10px var(--blue); }

        .hero-content { height: 100vh; display: flex; align-items: center; justify-content: center; padding: 0 20px; text-align: center; }

        .glass-panel {
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 60px 40px; border-radius: 40px;
            max-width: 800px; width: 100%;
            box-shadow: 0 40px 100px rgba(0,0,0,0.5);
            animation: slideUp 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        h1 { font-family: 'Space Grotesk'; font-size: clamp(2.5rem, 8vw, 5rem); margin: 10px 0; line-height: 0.85; letter-spacing: -2px; }
        .accent { color: var(--blue); }
        p { color: #94a3b8; font-size: 1.1rem; max-width: 600px; margin: 20px auto; line-height: 1.6; font-weight: 300; }

        .btn { 
            display: inline-block; padding: 20px 50px; background: var(--blue); color: white; 
            text-decoration: none; border-radius: 16px; font-weight: 800; margin-top: 20px;
            transition: 0.3s; text-transform: uppercase; letter-spacing: 2px; font-size: 0.9rem;
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
        }
        .btn:hover { transform: translateY(-5px) scale(1.02); box-shadow: 0 20px 40px rgba(59, 130, 246, 0.5); }

        @keyframes subtleZoom { from { transform: scale(1); } to { transform: scale(1.08); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="full-bg"></div>
    <nav>
        <div class="logo">TROPICAL<span style="color:white">RP</span></div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="departments.html">Agencies</a>
            <a href="rules.html">Rules</a>
            <a href="staff.html">Staff</a>
        </div>
    </nav>

    <div class="hero-content">
        <div class="glass-panel">
            <p style="letter-spacing: 10px; color: var(--blue); font-weight: 800; font-size: 0.7rem; margin-bottom: 0;">2026 • LOS ANGELES</p>
            <h1>THE TROPICS<br>ARE <span class="accent">WAITING.</span></h1>
            <p>Serious 13+ Roleplay. Built on professional standards, high-fidelity fleets, and a community dedicated to immersive storytelling.</p>
            <a href="https://discord.gg/GtRJAxcUDR" class="btn">Apply on Discord</a>
        </div>
    </div>
</body>
</html>
