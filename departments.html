<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Departments | Tropical RP</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&family=Space+Grotesk:wght@700&display=swap');
        body { margin: 0; background: #020617; color: white; font-family: 'Plus Jakarta Sans', sans-serif; height: 100vh; overflow: hidden; }
        
        .full-bg {
            position: fixed; width: 100%; height: 100%; z-index: -1;
            background: linear-gradient(rgba(2, 6, 23, 0.7), rgba(2, 6, 23, 0.9)), 
                        url('https://cdn.discordapp.com/attachments/1472741931258744854/1473043718549536988/image.png');
            background-size: cover; background-position: center;
        }

        .container { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 40px; }
        h2 { font-family: 'Space Grotesk'; font-size: 3rem; margin-bottom: 50px; text-transform: uppercase; letter-spacing: -1px; }
        
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; max-width: 1200px; width: 100%; }
        
        .card { 
            background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1); padding: 50px 30px; border-radius: 30px; 
            text-align: center; transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .card:hover { border-color: #3b82f6; transform: translateY(-15px); background: rgba(59, 130, 246, 0.05); }
        .card h3 { font-family: 'Space Grotesk'; font-size: 1.8rem; margin: 0 0 15px 0; color: #3b82f6; }
        .card p { color: #94a3b8; font-size: 0.95rem; line-height: 1.6; margin: 0; }
        
        @media (max-width: 950px) { .grid { grid-template-columns: 1fr; } .container { overflow-y: auto; padding: 100px 20px; height: auto; } }
    </style>
</head>
<body>
    <div class="full-bg"></div>
    <div class="container">
        <h2>Our <span style="color:#3b82f6">Agencies</span></h2>
        <div class="grid">
            <div class="card"><h3>LAPD</h3><p>Elite urban response and city-wide safety for the Los Angeles metro area.</p></div>
            <div class="card"><h3>LASD</h3><p>County-wide enforcement spanning from the valleys to the coastal highways.</p></div>
            <div class="card"><h3>CHP</h3><p>The thin gold line protecting California's vast highway networks.</p></div>
        </div>
        <p style="margin-top: 50px;"><a href="index.html" style="color: #64748b; text-decoration: none; font-weight: 800; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px;">← Return Home</a></p>
    </div>
</body>
</html>
