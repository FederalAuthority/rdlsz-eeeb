<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel | Tropical RP</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Space+Grotesk:wght@700&display=swap');
        :root { --blue: #3b82f6; --danger: #ef4444; --bg: #020617; --panel: #0f172a; }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Plus Jakarta Sans', sans-serif; display: flex; height: 100vh; }
        
        /* Sidebar */
        aside { width: 260px; background: #070b14; border-right: 1px solid rgba(255,255,255,0.05); padding: 40px 20px; }
        .nav-item { display: block; padding: 15px; color: #94a3b8; text-decoration: none; font-weight: 700; border-radius: 10px; margin-bottom: 5px; font-size: 0.8rem; }
        .nav-item.active { background: rgba(59, 130, 246, 0.1); color: var(--blue); }

        /* Main Content */
        main { flex: 1; padding: 40px 60px; overflow-y: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 40px; }
        .card { background: var(--panel); padding: 25px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; font-size: 0.7rem; color: var(--blue); text-transform: uppercase; padding-bottom: 15px; }
        td { padding: 15px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.85rem; }

        .btn { padding: 8px 15px; border-radius: 6px; border: none; font-weight: 800; cursor: pointer; font-size: 0.7rem; }
        .btn-view { background: rgba(59, 130, 246, 0.1); color: var(--blue); }
        .btn-kick { background: rgba(239, 68, 68, 0.1); color: var(--danger); }
    </style>
</head>
<body>
    <aside>
        <h2 style="font-family: 'Space Grotesk'; letter-spacing: 2px;">STAFF<span style="color:var(--blue)">WATCH</span></h2>
        <a href="#" class="nav-item active">Dashboard</a>
        <a href="#" class="nav-item">Recruitment Queue</a>
        <a href="#" class="nav-item">Ban Database</a>
        <a href="index.html" class="nav-item" style="margin-top:50px; color:var(--danger)">Logout</a>
    </aside>

    <main>
        <div class="header">
            <h1 style="font-family:'Space Grotesk'">Admin <span style="color:var(--blue)">Dashboard</span></h1>
            <div style="text-align:right">
                <div style="font-size:0.7rem; color:#64748b">Current Session</div>
                <strong>Prada (Owner)</strong>
            </div>
        </div>

        <div class="grid">
            <div class="card"><span>Players Online</span><h2 style="margin:5px 0">42 / 64</h2></div>
            <div class="card"><span>Server Uptime</span><h2 style="margin:5px 0">12d 4h</h2></div>
            <div class="card"><span>Pending Apps</span><h2 style="margin:5px 0; color:var(--blue)">7</h2></div>
        </div>

        <div class="card">
            <h4 style="margin:0">Active Recruitment Queue</h4>
            <table>
                <thead>
                    <tr><th>User</th><th>Department</th><th>Age</th><th>Actions</th></tr>
                </thead>
                <tbody>
                    <tr>
                        <td><strong>John_Doe</strong></td>
                        <td>LAPD</td>
                        <td>19</td>
                        <td><button class="btn btn-view">VIEW APP</button> <button class="btn btn-kick">DENY</button></td>
                    </tr>
                    <tr>
                        <td><strong>Deputy_Steve</strong></td>
                        <td>LASD</td>
                        <td>22</td>
                        <td><button class="btn btn-view">VIEW APP</button> <button class="btn btn-kick">DENY</button></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
